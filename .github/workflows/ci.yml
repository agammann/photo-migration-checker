name: Test and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve committed file bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Check the installed wheel outside the checkout
        shell: python
        run: |
          import os, pathlib, subprocess, sys, tempfile, venv, zipfile
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          with zipfile.ZipFile(wheel) as archive:
              assert archive.testzip() is None
              assert b'Copyright (c) Meta Platforms' in archive.read('pmc/web/THIRD-PARTY-NOTICES.txt')
              assert b'SIL OPEN FONT LICENSE' in archive.read('pmc/web/INTER-LICENSE.txt')
          with tempfile.TemporaryDirectory() as directory:
              root = pathlib.Path(directory)
              venv.EnvBuilder(with_pip=True).create(root / 'venv')
              python = root / 'venv' / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
              subprocess.run([str(python), '-m', 'pip', 'install', '-c', str(pathlib.Path('requirements.txt').resolve()), str(wheel)], check=True)
              subprocess.run([str(python), '-m', 'pip', 'check'], check=True)
              env = dict(os.environ)
              env.pop('PYTHONPATH', None)
              subprocess.run([str(python), '-c', 'import pmc; assert "site-packages" in pmc.__file__; print(pmc.__version__)'], cwd=root, env=env, check=True)
              subprocess.run([str(python), '-m', 'pmc', '--help'], cwd=root, env=env, check=True)
              # Exercise the installed application and its browser guard using only synthetic data.
              expected_fastapi = next(line.split('==', 1)[1] for line in pathlib.Path('requirements.txt').read_text().splitlines() if line.startswith('fastapi=='))
              smoke = '; '.join([
                  'import importlib.metadata as metadata',
                  'from pathlib import Path',
                  'from fastapi.testclient import TestClient',
                  'from pmc.api import create_app',
                  'import pmc, sys',
                  'assert "site-packages" in pmc.__file__',
                  'assert metadata.version("fastapi") == sys.argv[1]',
                  'app = create_app(Path("data"))',
                  'client = TestClient(app, base_url="http://127.0.0.1")',
                  'assert client.get("/api/bootstrap").status_code == 403',
                  'client.headers["x-pmc-token"] = app.state.token',
                  'response = client.get("/api/bootstrap")',
                  'assert response.status_code == 200 and response.json()["token"] == app.state.token',
                  'assert client.get("/api/bootstrap", headers={"Origin": "https://evil.example"}).status_code == 403',
                  'demo = client.post("/api/demo", json={"scenario": "correct"})',
                  'assert demo.status_code == 200 and demo.json()["demo"] is True',
                  'client.close()',
              ])
              subprocess.run([str(python), '-c', smoke, expected_fastapi], cwd=root, env=env, check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl
