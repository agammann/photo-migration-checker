name: Test and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve committed file bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Check the installed wheel outside the checkout
        shell: python
        run: |
          import os, pathlib, subprocess, sys, tempfile, venv, zipfile
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          with zipfile.ZipFile(wheel) as archive:
              assert archive.testzip() is None
              assert b'Copyright (c) Meta Platforms' in archive.read('pmc/web/THIRD-PARTY-NOTICES.txt')
              assert b'SIL OPEN FONT LICENSE' in archive.read('pmc/web/INTER-LICENSE.txt')
          with tempfile.TemporaryDirectory() as directory:
              root = pathlib.Path(directory)
              venv.EnvBuilder(with_pip=True, system_site_packages=True).create(root / 'venv')
              python = root / 'venv' / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
              subprocess.run([str(python), '-m', 'pip', 'install', '--no-deps', str(wheel)], check=True)
              env = dict(os.environ)
              env.pop('PYTHONPATH', None)
              subprocess.run([str(python), '-c', 'import pmc; assert "site-packages" in pmc.__file__; print(pmc.__version__)'], cwd=root, env=env, check=True)
              subprocess.run([str(python), '-m', 'pmc', '--help'], cwd=root, env=env, check=True)
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl
